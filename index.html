<head>

<link rel="icon" type="image/png" sizes="32x32" href="./assets/logo/favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./assets/logo/icon-192.png" />
<link rel="apple-touch-icon" href="./assets/logo/apple-touch-icon-180.png" />
<meta name="theme-color" content="#0e0e10" />

<link rel="preload" as="image" href="./assets/logo/logo-mark-256.png" />
<link rel="stylesheet" href="./vendor/tailwind.css" />
<link rel="stylesheet" href="./styles.css" />
<link rel="stylesheet" href="./landing.css" />
<link rel="stylesheet" href="./arena.css" />

<script type="importmap">
{
  "imports": {
    "preact": "./vendor/preact.module.js",
    "preact/hooks": "./vendor/hooks.module.js",
    "htm": "./vendor/htm.module.js"
  }
}
</script>
<script src="./vendor/chart.umd.js"></script>
<script src="./vendor/supabase.umd.js"></script>
</head>
<body class="bg-graphite-950 font-sans antialiased">
  <!-- Static pre-boot placeholder, inside #app: shown before main.js even
       loads, so it can't use the Preact <BootScreen/> component
       (components/ui.js) it's standing in for -- the SAME markup, written out
       here in plain HTML (styles.css loads above, before body). Keep the two
       in sync: Preact adopts these nodes when the app mounts, so identical
       structure means the animation carries on with no visible swap.
       There must be NO whitespace or comment nodes between the tags below:
       Preact re-inserts an adopted node that is not at the front of its
       parent's child list, and a re-inserted element restarts its CSS
       animations. The ">" at the start of a line closes the tag above it. -->
  <div id="app"><div class="sk-boot" role="status" aria-live="polite"
    ><div class="sk-boot-stage" aria-hidden="true"
      ><span class="sk-boot-tile"><img src="./assets/logo/logo-mark-256.png" width="88" height="88" alt="" /></span
    ></div
    ><div class="sk-boot-word">Decision<b>OS</b></div
    ><div class="sk-boot-track" aria-hidden="true"><span></span></div
    ><div class="sk-boot-label"><span class="sk-boot-phase" id="boot-phase">Загрузка</span><span class="sk-dots" aria-hidden="true"><i></i><i></i><i></i></span></div
  ></div></div>
  <script>
    // The pre-boot label in the visitor's own language, picked the same way
    // lib/i18n.js does (saved choice, then browser language, then ru). Runs
    // before the app loads, so it can't import that module.
    (function () {
      var words = { ru: "Загрузка", kk: "Жүктелуде", en: "Loading" }, id = "ru";
      try {
        var saved = localStorage.getItem("decisionos_locale");
        if (saved && words[saved]) id = saved;
        else {
          var nav = (navigator.language || "").slice(0, 2).toLowerCase();
          id = nav === "kk" || nav === "kz" ? "kk" : nav === "en" ? "en" : "ru";
        }
      } catch (e) {}
      var el = document.getElementById("boot-phase");
      if (el) el.textContent = words[id];
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
