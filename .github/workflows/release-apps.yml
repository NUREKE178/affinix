# Builds the Affinix apps and publishes them as a GitHub release, which is where the Download page of the site looks for them:
#   Affinix-Setup.exe (Windows, Electron), Affinix.AppImage (Linux, Electron) and Affinix.apk (Android, Capacitor).
# Run it by hand: Actions -> "Release apps" -> Run workflow (type a version, e.g. 1.0.0), or push a tag like v1.0.0.
name: Release apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set the version
        shell: bash
        run: |
          V="${VERSION#v}"
          npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: apps/desktop/dist/Affinix-Setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set the version
        run: npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npm run dist-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: apps/desktop/dist/Affinix.AppImage
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Icons and version
        run: |
          V="${VERSION#v}"
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icons/mipmap-$d/*.png $RES/mipmap-$d/; done
          rm -rf $RES/mipmap-anydpi-v26   # use the plain launcher PNGs above instead of the template's adaptive icon
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
      - run: npx cap sync android
      - name: Build the APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Affinix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/android/Affinix.apk
          if-no-files-found: error

  release:
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          name: Affinix ${{ inputs.version || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            out/Affinix-Setup.exe
            out/Affinix.apk
            out/Affinix.AppImage
