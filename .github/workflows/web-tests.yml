# The website's own tests: plain Node (no browser, no build step), for the pure logic in src/lib/.
#   node --test "tests/*.test.js"
name: Web tests

on:
  push:
    paths: ["src/**", "tests/**", ".github/workflows/web-tests.yml"]
  pull_request:
    paths: ["src/**", "tests/**", ".github/workflows/web-tests.yml"]

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node --test "tests/*.test.js"
