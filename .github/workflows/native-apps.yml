# Builds and tests the NATIVE Affinix apps (Kotlin + Compose Multiplatform: no browser engine inside).
#   test            unit tests + offscreen screenshots of every screen (artifact "native-screenshots": open the PNGs to see the app)
#   package-linux   Affinix.deb + a tar.gz of the self-contained app folder
#   package-windows Affinix.msi + Affinix.exe installers
# Run it: Actions -> "Native apps" -> Run workflow (optionally type a version), or push a change under native/.
# The old web-wrapper apps (release-apps.yml) stay until the native app has everything they have.
name: Native apps

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (for example 0.1.0)"
        required: false
        default: "0.1.0"
  push:
    paths: ["native/**", ".github/workflows/native-apps.yml"]

permissions:
  contents: read

concurrency:
  group: native-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: ${{ inputs.version || '0.1.0' }}

jobs:
  test:
    name: Tests and screenshots
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: System libraries Skia needs
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1 libfreetype6 libgl1
      - name: Strings are in sync with the website
        run: |
          node scripts/gen-strings.mjs
          git diff --exit-code -- composeApp/src/commonMain/kotlin/space/affinix/app/i18n/Strings.kt
      - name: Unit tests and screenshots
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screenshots
          path: native/composeApp/build/shots/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-reports
          path: native/composeApp/build/reports/tests
          if-no-files-found: warn

  package-linux:
    name: Linux (.deb)
    needs: test
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: native } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageDeb :composeApp:createDistributable -PappVersion="$APP_VERSION" --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/deb/*.deb out/Affinix-native.deb
          tar -C composeApp/build/compose/binaries/main/app -czf out/Affinix-native-linux.tar.gz Affinix
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: native-linux, path: native/out/* }

  package-windows:
    name: Windows (.msi, .exe)
    needs: test
    runs-on: windows-2022
    defaults: { run: { working-directory: native, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageMsi :composeApp:packageExe -PappVersion="$APP_VERSION" --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir -p out
          cp composeApp/build/compose/binaries/main/msi/*.msi out/Affinix-native.msi
          cp composeApp/build/compose/binaries/main/exe/*.exe out/Affinix-native-Setup.exe
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: native-windows, path: native/out/* }
