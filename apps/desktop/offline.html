    fetch(origin + "/manifest.webmanifest?ts=" + Date.now(), { mode: "no-cors", cache: "no-store" }).then(go, function () { busy = false; });
  }
  document.getElementById("r").addEventListener("click", go);
  window.addEventListener("online", probe);
  setInterval(probe, 5000);
</script>
</body></html>
